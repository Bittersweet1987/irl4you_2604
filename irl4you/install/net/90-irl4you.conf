# IRL4YOU BOX: NetworkManager verwaltet alle Karten (LAN, WLAN, Mobilfunk); ifupdown/ifplugd/dhclient entfallen unter 26.04.
[main]
plugins=keyfile
dns=systemd-resolved

[keyfile]
unmanaged-devices=none

[device]
# WLAN-Sticks nicht mit Zufalls-MAC suchen lassen (manche Treiber verlieren sonst die Verbindung)
wifi.scan-rand-mac-address=no

[connection-ethernet]
match-device=type:ethernet
# LAN-Kabel darf jederzeit gesteckt werden: DHCP wartet unbegrenzt und versucht es immer wieder
ipv4.dhcp-timeout=2147483647
connection.autoconnect-retries=0
