# IRL4YOU BOX: Geschwindigkeit begrenzen (Dispatcher pipbox-lan-speed). Zeilen:
#   all <Mbit/s>                    alle Netzkarten
#   subnet <Netz/Länge> <Mbit/s>    Karten mit einer Adresse in diesem Netz
#   mac <MAC-Adresse> <Mbit/s>      eine bestimmte Karte
# Erlaubt: 10, 100, 1000 (1000 = keine Begrenzung). Gilt ab dem nächsten Anmelden der Karte (Kabel ziehen oder Neustart).
# Orange Pi 5 Plus: Mit 1 Gbit/s an den Netzkarten (Netgear M1 und Fritzbox) stürzte die Box unter Last hart ab, mit 100 Mbit/s an beiden nicht.
all 100
