# IRL4YOU BOX: RTMP-Eingang für Kameras (nginx + libnginx-mod-rtmp aus Ubuntu 26.04), ersetzt belabox-rtmp-server.
# Liegt in modules-enabled, weil rtmp{} und stream{} auf oberster Ebene der nginx-Konfiguration stehen müssen
# (nach 50-mod-rtmp.conf und 50-mod-stream.conf, die die Module laden).
#   rtmp://<box>:1935/publish/<schlüssel>    Kameras senden hierhin
#   rtmps://<box>:1934/publish/<schlüssel>   dasselbe verschlüsselt (Zertifikat in /etc/nginx/certs/rtmps)
rtmp {
  server {
    listen 1935;
    chunk_size 8192;
    ack_window 8192;
    ping 30s;
    notify_method get;
    access_log off;

    application publish {
      live on;
      # Bild erst weitergeben, wenn ein Schlüsselbild da ist (sonst grüne Blöcke beim Einstieg)
      wait_key on;
      wait_video on;
      publish_notify on;
      play_restart on;
      idle_streams off;
      # Kamera mit kurzem WLAN-Hänger nicht nach 4 s rauswerfen (IRL4YOU: 15 s)
      drop_idle_publisher 15s;
      sync 4ms;
      interleave on;
    }
  }
}

stream {
  server {
    listen 1934 ssl;
    proxy_pass 127.0.0.1:1935;
    ssl_certificate /etc/nginx/certs/rtmps/cert.pem;
    ssl_certificate_key /etc/nginx/certs/rtmps/privkey.pem;
  }
}
