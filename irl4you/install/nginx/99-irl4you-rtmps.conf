# IRL4YOU BOX: RTMPS-Eingang. nginx (stream-Modul aus Ubuntu 26.04) beendet nur TLS auf Port 1934 und reicht den Strom unverändert an den RTMP-Eingang
# (SRS) auf 127.0.0.1:1935 weiter. Zertifikat: /etc/nginx/certs/rtmps (wird bei der Installation angelegt oder aus der alten Box übernommen).
# Liegt in modules-enabled, weil stream{} auf oberster Ebene der nginx-Konfiguration stehen muss (nach 50-mod-stream.conf, das das Modul lädt).
stream {
  server {
    listen 1934 ssl;
    proxy_pass 127.0.0.1:1935;
    ssl_certificate /etc/nginx/certs/rtmps/cert.pem;
    ssl_certificate_key /etc/nginx/certs/rtmps/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
  }
}
