# IRL4YOU BOX: RTMP-Eingang mit SRS 6 (ersetzt nginx-rtmp; SRS kann HEVC/H.265 über RTMP, nginx-rtmp nicht).
#   rtmp://<box>:1935/publish/<schlüssel>    Kameras und Zuspieler senden hierhin (H.264 und H.265)
#   rtmps://<box>:1934/publish/<schlüssel>   dasselbe verschlüsselt: nginx (stream-Modul) beendet TLS und reicht an 127.0.0.1:1935 weiter
# IRL4YOU liest die Streams per RTMP von 127.0.0.1:1935 (H.264) und kann später je Stream HTTP-TS von 127.0.0.1:8085 lesen (auch H.265).
# Die Statistik (Seite auf Port 1936, Format wie früher) macht pipbox-rtmpstat.py aus der lokalen API (127.0.0.1:1985).
# Datei gehört dem Release (install/srs/srs.conf) und wird nach /etc/irl4you/srs.conf kopiert.

pid                 /run/irl4you-srs/srs.pid;
listen              1935;
max_connections     200;
daemon              off;
srs_log_tank        console;
srs_log_level       warn;

# SRT-Eingang (wie bisher UDP 4000): Zuspieler senden per SRT, SRS macht daraus denselben Strom wie bei RTMP.
#   srt://<box>:4000?streamid=#!::r=publish/<schlüssel>,m=publish
srt_server {
    enabled         on;
    listen          4000;
    connect_timeout 4000;
    peerlatency     300;
    recvlatency     300;
}

http_api {
    enabled         on;
    listen          127.0.0.1:1985;
}

http_server {
    enabled         on;
    listen          127.0.0.1:8085;
    dir             /var/empty;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    play {
        # Ein Zuschauer (IRL4YOU) steigt am nächsten Schlüsselbild ein, ohne gepufferten Anfang (wie wait_key im früheren nginx-rtmp)
        gop_cache       off;
        queue_length    10;
        mw_latency      100;
    }

    publish {
        # RTMP trägt H.264 immer als Länge+NAL (AVCC). SRS probiert standardmäßig zuerst Annex-B und wird dabei von manchen Handy-Encodern
        # (Redmi) getäuscht: Abbruch "not annexb" beim ersten Bild, Sender verbindet endlos neu. Zuerst Längenformat prüfen.
        try_annexb_first    off;
        # Eine Kamera, die kurz nichts schickt (WLAN-Hänger), wird erst nach 15 s getrennt (nginx-rtmp: drop_idle_publisher 15s)
        firstpkt_timeout    20000;
        normal_timeout      15000;
    }

    srt {
        enabled         on;
        srt_to_rtmp     on;
    }

    http_remux {
        # HTTP-TS je Stream, für spätere H.265-Quellen (GStreamer liest das mit souphttpsrc ! tsdemux)
        enabled     on;
        mount       [vhost]/[app]/[stream].ts;
    }
}
