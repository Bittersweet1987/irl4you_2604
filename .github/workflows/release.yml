name: Release
# Ein Release entsteht, wenn ein Commit auf main die Datei VERSION ändert (z. B. "0.2").
# Tag und GitHub-Release heißen dann v0.2.0. Manuell nachholbar über "Run workflow".
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          case "$v" in
            [0-9]*.[0-9]*.*) echo "VERSION '$v' ist kein Release (x.y erwartet)"; exit 0 ;;
            [0-9]*.[0-9]*) ;;
            *) echo "VERSION '$v' ungültig"; exit 1 ;;
          esac
          tag="v$v.0"
          lic="Lizenz: CC BY-ND 4.0 (Nutzung auch kommerziell erlaubt, Änderungen nur nach Rückfrage bei Bittersweet1987 oder Akino01, Ausnahme IRL4YOU), siehe LICENSE und ZUSATZERLAUBNIS.md im Repository. Drittprojekte behalten ihre Lizenzen (NOTICE.md)."
          if gh release view "$tag" >/dev/null 2>&1; then
            body="$(gh release view "$tag" --json body --jq .body)"
            case "$body" in *"CC BY-ND 4.0"*) echo "$tag existiert schon"; exit 0 ;; esac
            gh release edit "$tag" --notes "$(printf '%s\n\n%s' "$lic" "$body")"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes --notes "$lic"
