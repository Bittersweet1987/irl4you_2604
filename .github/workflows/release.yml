name: Release
# Neue Version veröffentlichen: VERSION anheben, committen, Marke v<Version> setzen und pushen.
#   git tag v2.0.1 && git push origin v2.0.1
# Eine Marke mit Bindestrich (z. B. v2.1.0-beta.1) wird als Vorabversion veröffentlicht (nur Kanal "beta" der Box).
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Marke passt zu VERSION
        run: |
          v=$(tr -d ' \n\r' < VERSION)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Marke $GITHUB_REF_NAME passt nicht zu VERSION $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s tests
      - name: Paket bauen
        run: tools/build-release.sh irl4you dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          notes=$(python3 tools/release-notes.py "$VERSION" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" $pre --title "IRL4YOU $VERSION" --notes "$notes" \
            "dist/irl4you-$VERSION.tar.gz" "dist/irl4you-$VERSION.tar.gz.sha256"
